name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 环境信息
        run: |
          node --version
          uname -a

      # 四层验收：全量测试 → 单包构建（产物与源码不同步是本项目最容易犯的错）
      # → 面板 API 冒烟（16 个关键接口，临时记忆库）→ 向量后端实测。
      # CI 上没有本机 llama-server，第 4 层自动 SKIP（不是失败）。
      - name: 全功能验收（verify:all）
        run: npm run verify:all

      # 检索质量门禁：合成集、无嵌入服务，几秒内完成（评测器退出码恒 0，不阻塞 CI）。
      - name: 检索评测（合成集）
        run: node tools/eval/run.mjs --mode synthetic --no-public --quiet
