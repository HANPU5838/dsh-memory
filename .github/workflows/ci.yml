name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 环境信息
        run: |
          node --version
          uname -a

      # 四层验收：全量测试 → 单包构建（产物与源码不同步是本项目最容易犯的错）
      # → 面板 API 冒烟（16 个关键接口，临时记忆库）→ 向量后端实测。
      # CI 上没有本机 llama-server，第 4 层自动 SKIP（不是失败）。
      # 文档一致性守门：版本 / badge / CHANGELOG / IMPROVEMENTS / 链接 / build 版本。
      - name: 文档一致性（check:docs）
        run: npm run check:docs

      - name: 发布链路检查（release:check）
        run: npm run release:check

      - name: 全功能验收（verify:all）
        run: npm run verify:all

      # 图增强多跳评测（纯本地、秒级）：桥接召回与无关记录作为回归参考。
      - name: 图增强多跳评测（eval:graph）
        run: npm run eval:graph

      # 检索参数扫描（纯本地、约 2 秒）：把默认值的稳健性留成 CI 日志。
      - name: 检索参数扫描（eval:tune）
        run: npm run eval:tune

      # 召回摘要评测（纯本地、秒级）：关键结论保留率作为回归参考。
      - name: 召回摘要评测（eval:summarize）
        run: npm run eval:summarize

      # 检索质量门禁：合成集、无嵌入服务，几秒内完成（评测器退出码恒 0，不阻塞 CI）。
      - name: 检索评测（合成集）
        run: node tools/eval/run.mjs --mode synthetic --no-public --quiet
