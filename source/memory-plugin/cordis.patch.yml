# dsh-memory 单入口 bundle patch —— 一个包,一条 entry。
#
# 发布包里的 patch 是**纯 insert、不带 config**(为了可热挂载:宿主的 hot-mount 只支持
# 纯 insert 行,带 config/表达式就只能重启生效)。这里这份是开发期的配置样例。
- id: dsh-memory
  name: '@hanpu5838/dsh-memory'
  config:
    storeDir: !!js process.env.DSH_MEMORY_DIR ?? '.dsh-memory'
    scopes:
      global: true
      project: true
      session: true                 # 写路径默认落"当前会话";会话标题由 DSH 提供
      custom:
        enabled: true               # 允许 memory_save 用任意名字自建 scope
        max: 200                    # 只统计自定义 scope;会话/项目/global 不计入
    retrieval:
      topK: 5
      recallN: 30
      globalThreshold: 0.12
      projectThreshold: 0.1
      vector:
        enabled: true
        endpoint: !!js process.env.DSH_MEMORY_EMBED_ENDPOINT ?? 'http://127.0.0.1:8078/v1/embeddings'
        model: bge-m3
        dims: 1024
    limits:
      maxRecordsPerScope: 2000
      maxRecordChars: 4000
    secrets:
      enabled: true
      mode: refuse
    tools:
      defaultScope: session         # session(新默认)/ project / global;省略 scope 时写到哪
      # projectScope 缺省 = project:<会话 cwd>(工作区);要固定团队库才显式指定,
      # 且要带 project: 前缀,例如 project:/abs/path/to/workspace
    inject:
      enabled: true
      tokenBudget: 500
      topK: 5
      # extraScopes: ['handbook']    # 额外参与自动召回的 scope(默认是 会话+项目+global)
    panel:
      route: '/memory/api'
